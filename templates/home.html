{% extends 'base.html' %}

{% block content %}

<h1>Available Jobs</h1>

{% for job in jobs %}

<div class="job-card">

    <h2>{{ job.title }}</h2>

    <p><strong>Company:</strong> {{ job.company }}</p>

    <p><strong>Location:</strong> {{ job.location }}</p>

    <p><strong>Salary:</strong> {{ job.salary }}</p>

    <p>{{ job.description }}</p>

</div>

{% empty %}

<p>No Jobs Available</p>

{% endfor %}

{% endblock %}
