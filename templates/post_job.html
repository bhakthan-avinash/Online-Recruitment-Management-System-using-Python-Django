{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow p-4">

            <h1 class="mb-4 text-center">

                Post a Job

            </h1>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit"
                        class="btn btn-warning w-100">

                    Post Job

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
