{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow p-4 mt-4">

            <h1 class="text-center mb-4">

                Register

            </h1>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit"
                        class="btn btn-success w-100">

                    Register

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
