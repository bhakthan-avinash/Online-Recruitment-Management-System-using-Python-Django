{% extends 'base.html' %}

{% block content %}

<h1>Apply for {{ job.title }}</h1>

<form method="POST"
      enctype="multipart/form-data">

    {% csrf_token %}

    <label>Upload Resume (PDF)</label>

    <input type="file" name="resume">

    <button type="submit">

        Apply Job

    </button>

</form>

{% endblock %}
