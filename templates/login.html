{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow p-4 mt-4">

            <h1 class="text-center mb-4">

                Login

            </h1>

            <form method="POST">

                {% csrf_token %}

                <input type="text"
                       name="username"
                       class="form-control mb-3"
                       placeholder="Username">

                <input type="password"
                       name="password"
                       class="form-control mb-3"
                       placeholder="Password">

                <button type="submit"
                        class="btn btn-primary w-100">

                    Login

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
